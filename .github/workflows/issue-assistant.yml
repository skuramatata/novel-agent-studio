name: DeepSeek Issue 助手
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions: {}
concurrency:
  group: issue-assistant-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  analyze:
    if: >-
      !github.event.issue.pull_request &&
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'issues' || startsWith(github.event.comment.body, '/ai'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      ready: ${{ steps.analyze.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: analyze
        run: node scripts/issue-assistant.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      - if: steps.analyze.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: issue-reply
          path: reply.json
          retention-days: 1
  publish:
    needs: analyze
    if: needs.analyze.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: issue-reply
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const reply = JSON.parse(fs.readFileSync('reply.json', 'utf8'));
            const event = context.payload;
            const marker = `<!-- issue-assistant:v1:${event.issue.number}:${event.comment ? `comment-${event.comment.id}` : 'opened'} -->`;
            if (reply.marker !== marker || typeof reply.body !== 'string' || !reply.body.startsWith(marker + '\n') || reply.body.length > 15000) throw Error('回复校验失败');
            const params = {...context.repo, issue_number: event.issue.number};
            const {data: issue} = await github.rest.issues.get(params);
            if (issue.state !== 'open' || issue.pull_request) return;
            const comments = await github.paginate(github.rest.issues.listComments, {...params, per_page: 100});
            const replies = comments.filter(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith('<!-- issue-assistant:v1:'));
            if (replies.length >= 5 || replies.some(c => c.body.startsWith(marker))) return;
            await github.rest.issues.createComment({...params, body: reply.body});
